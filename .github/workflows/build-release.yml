name: Release + Build (DEB / RPM)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  QT_VERSION: "6.11.2"
  APP_NAME: "euclid-rui"       # package name / install prefix under /usr/local
  BIN_NAME: "euclid_rui"       # actual executable file name produced by CMake

permissions:
  contents: write       # required for tagging + releasing
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR / Tag
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.strip_tag.outputs.clean_tag }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GH_AUTH_TOKEN }}

      - name: Strip leading 'v' from tag
        id: strip_tag
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          CLEAN="${TAG#v}"   # remove leading 'v'
          echo "clean_tag=$CLEAN" >> $GITHUB_OUTPUT

  build-linux-deb:
    name: Build & Package (Linux DEB)
    runs-on: ubuntu-22.04
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      BUILD_DIR: "${{ github.workspace }}/build-linux"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build ruby ruby-dev \
            libfreetype6-dev libfontconfig1-dev libglib2.0-dev libx11-dev libxext-dev libxrender-dev
          sudo gem install --no-document fpm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          install-deps: true

      - name: Configure (Linux)
        run: |
          mkdir -p $BUILD_DIR
          cmake -S . -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build (Linux)
        run: |
          cmake --build $BUILD_DIR --parallel $(nproc)

      - name: Prepare package structure
        run: |
          PACKAGE_DIR=package
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> $GITHUB_ENV

          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/bin
          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/lib
          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/plugins
          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/qml

          # App binary. euclid-rui embeds its own QML as AOT-compiled resources, so only Qt's own
          # runtime (shared libs, platform/style plugins, Qt-provided QML modules like
          # QtQuick.Controls.Material and QtQuick.Dialogs) needs to be bundled alongside it.
          cp $BUILD_DIR/$BIN_NAME $PACKAGE_DIR/usr/local/$APP_NAME/bin/
          cp -r $QT_ROOT_DIR/lib/* $PACKAGE_DIR/usr/local/$APP_NAME/lib/
          cp -r $QT_ROOT_DIR/plugins/* $PACKAGE_DIR/usr/local/$APP_NAME/plugins/
          cp -r $QT_ROOT_DIR/qml/* $PACKAGE_DIR/usr/local/$APP_NAME/qml/

          cat << EOF > $PACKAGE_DIR/usr/local/$APP_NAME/bin/qt.conf
          [Paths]
          Prefix = ..
          Qml2Imports = qml
          EOF

      - name: Build DEB with fpm
        run: |
          fpm -s dir -t deb --name "${APP_NAME}" --version "${SEMVER}" --architecture amd64 \
            --package "${APP_NAME}-${SEMVER}-amd64.deb" -C "$PACKAGE_DIR" usr/local/$APP_NAME

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-linux
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.deb

  build-linux-rpm:
    name: Build & Package (Linux RPM)
    runs-on: ubuntu-22.04
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      BUILD_DIR: "${{ github.workspace }}/build-linux"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build ruby ruby-dev \
            libfreetype6-dev libfontconfig1-dev libglib2.0-dev libx11-dev libxext-dev libxrender-dev
          sudo gem install --no-document fpm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          install-deps: true

      - name: Configure (Linux)
        run: |
          mkdir -p $BUILD_DIR
          cmake -S . -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build (Linux)
        run: |
          cmake --build $BUILD_DIR --parallel $(nproc)

      - name: Prepare package structure
        run: |
          PACKAGE_DIR=package
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> $GITHUB_ENV

          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/bin
          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/lib
          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/plugins
          mkdir -p $PACKAGE_DIR/usr/local/$APP_NAME/qml

          cp $BUILD_DIR/$BIN_NAME $PACKAGE_DIR/usr/local/$APP_NAME/bin/
          cp -r $QT_ROOT_DIR/lib/* $PACKAGE_DIR/usr/local/$APP_NAME/lib/
          cp -r $QT_ROOT_DIR/plugins/* $PACKAGE_DIR/usr/local/$APP_NAME/plugins/
          cp -r $QT_ROOT_DIR/qml/* $PACKAGE_DIR/usr/local/$APP_NAME/qml/

          cat << EOF > $PACKAGE_DIR/usr/local/$APP_NAME/bin/qt.conf
          [Paths]
          Prefix = ..
          Qml2Imports = qml
          EOF

      - name: Build RPM with fpm
        run: |
          fpm -s dir -t rpm --name "${APP_NAME}" --version "${SEMVER}" --architecture amd64 \
            --package "${APP_NAME}-${SEMVER}-amd64.rpm" -C "$PACKAGE_DIR" usr/local/$APP_NAME

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-linux
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.rpm

  publish:
    name: Publish Release & Attach Packages
    runs-on: ubuntu-latest
    needs: [ release-please, build-linux-deb, build-linux-rpm ]
    env:
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Download Linux DEB package
        uses: actions/download-artifact@v4
        with:
          name: deb-package-linux
          path: artifacts/linux

      - name: Download Linux RPM package
        uses: actions/download-artifact@v4
        with:
          name: rpm-package-linux
          path: artifacts/linux

      - name: Create GitHub Release (attach packages)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
          name: Release ${{ env.SEMVER }}
          tag_name: ${{ env.SEMVER }}
          body: "Automated release for ${{ env.SEMVER }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}

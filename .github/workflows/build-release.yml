name: Release + Build (Linux / macOS / Windows, static Qt)

# Adapted from ~/work/awsmock-qt-ui's build-release.yml, with one structural difference: that
# template installs a normal (dynamic) Qt via jurplel/install-qt-action / aqtinstall for every
# run. Here Qt is built *from source* with -static once per OS and cached (actions/cache, keyed
# on OS + Qt version), since no prebuilt static Qt package exists. Every build job downstream
# just restores that cache instead of rebuilding Qt - only a cache-key bump or the first-ever run
# pays the (multi-hour) source build cost.
#
# Because the app binary is statically linked against Qt, packaging is simpler than the template
# in one respect: there's no Qt runtime (shared libs/plugins/qml modules) to bundle alongside it
# with windeployqt/macdeployqt - the executable is already self-contained.
#
# Windows installer: like awsmock-qt-ui, Windows is packaged as a real Qt Installer Framework
# (IFW) installer (dist/win32/installer/config + dist/win32/installer/packages/<id>/), not just a
# zipped exe - this gives Windows users the same "check for updates" capability the IFW
# maintenance tool provides, pointed at a repogen-generated online repository (RemoteRepositories
# in config.xml, published to GitHub Pages by the "deploy" job, same idea as the "build-apt-repo"
# job below but using IFW's own repository format instead of APT's). The config.xml/package.xml
# IFW reads are generated from *.xml.in templates by CMakeLists.txt at configure time (gitignored,
# not committed) - unlike awsmock-qt-ui, no windeployqt step is needed here since the exe is
# already statically self-contained; it's just copied straight into the package's data/ folder.
#
# APT repository: the "build-apt-repo" job turns the .deb built by "build-linux-deb" into a real
# signed APT repository (Packages/Release/InRelease under dists/, the .deb itself under pool/) so
# `sudo apt update && sudo apt upgrade` picks up new releases, instead of users having to manually
# download a new .deb every time. GitHub Pages deployment (actions/deploy-pages) is stateless -
# each deploy replaces the whole site - so the repository tree is *not* rebuilt from scratch every
# run; it's persisted across releases in a dedicated "apt-repo" branch that this job checks out,
# adds the new package to, re-signs, and pushes back. The "deploy" job then copies that branch's
# contents into public/apt/ alongside the other installers. This requires three repo secrets that
# aren't needed by the rest of the workflow, generated once by the maintainer
# (`gpg --full-generate-key`, then `gpg --export-secret-keys --armor <key-id>`):
#   - APT_GPG_PRIVATE_KEY: ASCII-armored exported private signing key
#   - APT_GPG_KEY_ID: that key's ID/fingerprint (used as --default-key when signing)
#   - APT_GPG_PASSPHRASE: the key's passphrase (set to an empty secret if the key has none)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  QT_VERSION: "6.11.2"
  # Qt submodules actually needed to satisfy euclid-rui's CMakeLists.txt find_package(Qt6
  # COMPONENTS Core Gui Network Qml Quick QuickControls2 QuickDialogs2) - qtshadertools is a
  # required build dependency of qtdeclarative, not directly used by the app.
  QT_MODULES: "qtbase,qtdeclarative,qtshadertools"
  # Bump to force every static-Qt cache to rebuild from scratch (e.g. after changing QT_MODULES).
  QT_CACHE_VERSION: "v2"
  APP_NAME: "euclid-rui"
  BIN_NAME: "euclid_rui"
  INSTALLER_ID: "de.jensvogt.euclidrui" # Qt Installer Framework package path (Windows only)

permissions:
  contents: write       # required for tagging + releasing
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR / Tag
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.strip_tag.outputs.clean_tag }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GH_AUTH_TOKEN }}

      - name: Strip leading 'v' from tag
        id: strip_tag
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          CLEAN="${TAG#v}"   # remove leading 'v'
          echo "clean_tag=$CLEAN" >> $GITHUB_OUTPUT

  # ── Static Qt, built once per OS and cached ────────────────────────────────

  build-qt-static-linux:
    name: Build static Qt (Linux, cached)
    runs-on: ubuntu-22.04
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Restore/save cached static Qt
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt-static
          key: qt-static-linux-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Install Qt build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build git perl python3 pkg-config \
            libssl-dev libfontconfig1-dev libfreetype6-dev libglib2.0-dev libgl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev \
            libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev

      - name: Clone Qt sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "v${{ env.QT_VERSION }}" --depth 1 https://github.com/qt/qt5.git qt-src
          cd qt-src
          perl init-repository --module-subset=${{ env.QT_MODULES }}

      - name: Configure static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p qt-build
          cd qt-build
          # -xcb (rather than leaving xcb support to auto-detection) turns a missing X11/xcb dev
          # package into a hard configure failure instead of a silently xcb-less Qt6Gui - which is
          # exactly how euclid-rui 1.0.14 shipped with no working platform plugin at all and every
          # install crashed on startup with "Could not find the Qt platform plugin 'xcb'" (the
          # actual bug was libxcb-xkb-dev missing from the dependency list above).
          ../qt-src/configure -static -release -opensource -confirm-license \
            -prefix "${{ github.workspace }}/qt-static" \
            -nomake examples -nomake tests \
            -submodules ${{ env.QT_MODULES }} \
            -qt-tiff -no-icu -qt-pcre -qt-libpng -qt-libjpeg -xcb

      - name: Build static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --build qt-build --parallel $(nproc)

      - name: Install static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --install qt-build

  build-qt-static-macos:
    name: Build static Qt (macOS, cached)
    runs-on: macos-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Restore/save cached static Qt
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt-static
          key: qt-static-macos-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Install Qt build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja pkg-config

      - name: Clone Qt sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "v${{ env.QT_VERSION }}" --depth 1 https://github.com/qt/qt5.git qt-src
          cd qt-src
          perl init-repository --module-subset=${{ env.QT_MODULES }}

      - name: Configure static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p qt-build
          cd qt-build
          ../qt-src/configure -static -release -opensource -confirm-license \
            -prefix "${{ github.workspace }}/qt-static" \
            -nomake examples -nomake tests \
            -submodules ${{ env.QT_MODULES }}

      - name: Build static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --build qt-build --parallel $(sysctl -n hw.logicalcpu)

      - name: Install static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --install qt-build

  build-qt-static-windows:
    name: Build static Qt (Windows, cached)
    runs-on: windows-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Restore/save cached static Qt
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\qt-static
          key: qt-static-windows-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Setup MSVC environment
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: choco install ninja -y

      - name: Clone Qt sources
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --branch "v${{ env.QT_VERSION }}" --depth 1 https://github.com/qt/qt5.git qt-src
          cd qt-src
          perl init-repository --module-subset=${{ env.QT_MODULES }}

      - name: Configure static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          mkdir qt-build
          cd qt-build
          ..\qt-src\configure.bat -static -static-runtime -release -opensource -confirm-license ^
            -prefix "${{ github.workspace }}\qt-static" ^
            -nomake examples -nomake tests ^
            -submodules %QT_MODULES%

      - name: Build static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: cmake --build qt-build --parallel %NUMBER_OF_PROCESSORS%

      - name: Install static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: cmake --install qt-build

  # ── App builds, each restoring its platform's cached static Qt ────────────

  build-linux-deb:
    name: Build & Package (Linux DEB)
    runs-on: ubuntu-22.04
    needs: [ release-please, build-qt-static-linux ]
    env:
      BUILD_DIR: "${{ github.workspace }}/build-linux"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cached static Qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt-static
          key: qt-static-linux-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Install packaging tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build ruby ruby-dev libgl1-mesa-dev libegl1-mesa-dev
          sudo apt install -y libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo gem install --no-document fpm

      - name: Configure (Linux)
        run: |
          mkdir -p $BUILD_DIR
          cmake -S . -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt-static"

      - name: Build (Linux)
        run: cmake --build $BUILD_DIR --parallel $(nproc)

      - name: Prepare package structure
        run: |
          PACKAGE_DIR=package
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> $GITHUB_ENV
          mkdir -p $PACKAGE_DIR/usr/bin
          # Statically linked - the single binary is the whole package, no Qt runtime to bundle.
          cp $BUILD_DIR/$BIN_NAME $PACKAGE_DIR/usr/bin/$APP_NAME

      - name: Build DEB with fpm
        run: |
          fpm -s dir -t deb --name "${APP_NAME}" --version "${SEMVER}" --architecture amd64 \
            --package "${APP_NAME}-${SEMVER}-amd64.deb" -C "$PACKAGE_DIR" usr/bin

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-linux
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.deb

  build-linux-rpm:
    name: Build & Package (Linux RPM)
    runs-on: ubuntu-22.04
    needs: [ release-please, build-qt-static-linux ]
    env:
      BUILD_DIR: "${{ github.workspace }}/build-linux"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cached static Qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt-static
          key: qt-static-linux-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Install packaging tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build ruby ruby-dev libgl1-mesa-dev libegl1-mesa-dev
          sudo apt install -y libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo gem install --no-document fpm

      - name: Configure (Linux)
        run: |
          mkdir -p $BUILD_DIR
          cmake -S . -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt-static"

      - name: Build (Linux)
        run: cmake --build $BUILD_DIR --parallel $(nproc)

      - name: Prepare package structure
        run: |
          PACKAGE_DIR=package
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> $GITHUB_ENV
          mkdir -p $PACKAGE_DIR/usr/bin
          cp $BUILD_DIR/$BIN_NAME $PACKAGE_DIR/usr/bin/$APP_NAME

      - name: Build RPM with fpm
        run: |
          fpm -s dir -t rpm --name "${APP_NAME}" --version "${SEMVER}" --architecture amd64 \
            --package "${APP_NAME}-${SEMVER}-amd64.rpm" -C "$PACKAGE_DIR" usr/bin

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-linux
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.rpm

  build-apt-repo:
    name: Publish APT Repository
    runs-on: ubuntu-22.04
    needs: [ release-please, build-linux-deb ]
    env:
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
      REPO_BRANCH: "apt-repo"
      APT_DIST: "stable"
      APT_COMPONENT: "main"
      APT_ARCH: "amd64"
    steps:
      - name: Install apt-ftparchive + gnupg
        run: |
          sudo apt update
          sudo apt install -y apt-utils gnupg

      - name: Download .deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package-linux
          path: artifacts/linux

      - name: Checkout or initialize apt-repo branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" "$REPO_BRANCH" >/dev/null; then
            git clone --branch "$REPO_BRANCH" --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apt-repo
          else
            mkdir apt-repo
            cd apt-repo
            git init -b "$REPO_BRANCH"
            cd ..
          fi

      - name: Add package to pool
        run: |
          set -euo pipefail
          POOL_DIR="apt-repo/pool/main/e/euclid-rui"
          mkdir -p "$POOL_DIR"
          cp artifacts/linux/*.deb "$POOL_DIR/"

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Generate Packages + Release indices
        run: |
          set -euo pipefail
          cd apt-repo
          DIST_DIR="dists/$APT_DIST/$APT_COMPONENT/binary-$APT_ARCH"
          mkdir -p "$DIST_DIR"

          apt-ftparchive packages pool > "$DIST_DIR/Packages"
          gzip -kf "$DIST_DIR/Packages"

          printf '%s\n' \
            "APT::FTPArchive::Release::Origin \"Euclid RUI\";" \
            "APT::FTPArchive::Release::Label \"Euclid RUI\";" \
            "APT::FTPArchive::Release::Suite \"$APT_DIST\";" \
            "APT::FTPArchive::Release::Codename \"$APT_DIST\";" \
            "APT::FTPArchive::Release::Architectures \"$APT_ARCH\";" \
            "APT::FTPArchive::Release::Components \"$APT_COMPONENT\";" \
            > apt-ftparchive.conf
          apt-ftparchive -c apt-ftparchive.conf release "dists/$APT_DIST" > "dists/$APT_DIST/Release"
          rm apt-ftparchive.conf

      - name: Sign repository metadata
        run: |
          set -euo pipefail
          cd apt-repo
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.APT_GPG_KEY_ID }}" \
            -abs -o "dists/$APT_DIST/Release.gpg" "dists/$APT_DIST/Release"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.APT_GPG_KEY_ID }}" \
            --clearsign -o "dists/$APT_DIST/InRelease" "dists/$APT_DIST/Release"
          gpg --export --armor "${{ secrets.APT_GPG_KEY_ID }}" > euclid-rui.gpg.asc

      - name: Commit and push apt-repo branch
        run: |
          set -euo pipefail
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish euclid-rui ${SEMVER} to apt repo" || { echo "Nothing to commit"; exit 0; }
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$REPO_BRANCH"

  build-macos:
    name: Build & Package (macOS)
    runs-on: macos-latest
    needs: [ release-please, build-qt-static-macos ]
    env:
      BUILD_DIR: "${{ github.workspace }}/build-macos"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cached static Qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt-static
          key: qt-static-macos-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Configure (macOS)
        run: |
          mkdir -p $BUILD_DIR
          cmake -S . -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt-static"

      - name: Build (macOS)
        run: cmake --build $BUILD_DIR --parallel $(sysctl -n hw.logicalcpu)

      - name: Codesign + create DMG
        run: |
          APP_BUNDLE="$BUILD_DIR/${APP_NAME}.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            # qt_add_executable() only produces a .app bundle for a GUI-flagged target; fall back
            # to wrapping the raw binary if that didn't happen for some reason.
            echo "No .app bundle at $APP_BUNDLE, packaging the raw binary instead"
            mkdir -p "dist-root/${APP_NAME}.app/Contents/MacOS"
            cp "$BUILD_DIR/$BIN_NAME" "dist-root/${APP_NAME}.app/Contents/MacOS/$APP_NAME"
            APP_BUNDLE="dist-root/${APP_NAME}.app"
          fi
          # Ad-hoc signed (no Apple Developer ID here) - fine for local/manual install, not
          # notarized for Gatekeeper-free distribution.
          codesign --force --deep --options runtime --entitlements dist/macos/entitlements.plist --sign - "$APP_BUNDLE"
          mkdir -p dist
          DMG_NAME="${APP_NAME}-${SEMVER}-macos.dmg"
          hdiutil create "dist/$DMG_NAME" -volname "${APP_NAME}" -srcfolder "$APP_BUNDLE" -ov -format UDZO

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/${{ env.APP_NAME }}-${{ env.SEMVER }}-macos.dmg

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    needs: [ release-please, build-qt-static-windows ]
    env:
      BUILD_DIR: "${{ github.workspace }}\\build-windows"
      INSTALLER_DIR: "${{ github.workspace }}\\dist\\win32\\installer"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cached static Qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\qt-static
          key: qt-static-windows-${{ env.QT_VERSION }}-${{ env.QT_CACHE_VERSION }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Python & aqtinstall
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U aqtinstall

      - name: Install Qt Installer Framework (IFW)
        shell: powershell
        run: python -m aqt install-tool windows desktop tools_ifw --outputdir "${{ github.workspace }}\ifw-tools"

      # Also regenerates dist/win32/installer/{config/config.xml,packages/*/meta/package.xml}
      # from their *.xml.in templates (version.txt -> VERSION_STRING), same as every other
      # platform's configure step - see CMakeLists.txt.
      - name: Configure (Windows)
        shell: powershell
        run: |
          cmake -S . -B $env:BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}\qt-static"

      - name: Build (Windows)
        shell: powershell
        run: cmake --build $env:BUILD_DIR --parallel

      - name: Stage exe into installer package
        shell: powershell
        run: |
          # Statically linked (and -static-runtime, so the MSVC runtime is embedded too) - the
          # single .exe is self-contained, no windeployqt needed, unlike awsmock-qt-ui's Windows
          # job (which installs a dynamic Qt via aqtinstall and has to bundle its runtime).
          $dataDir = "$env:INSTALLER_DIR\packages\$env:INSTALLER_ID\data"
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Copy-Item "$env:BUILD_DIR\$env:BIN_NAME.exe" "$dataDir\$env:APP_NAME.exe"

      - name: Build Qt Installer Framework installer (binarycreator)
        shell: powershell
        run: |
          $ifwRoot = Get-ChildItem "${{ github.workspace }}\ifw-tools\Tools\QtInstallerFramework" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $ifwRoot) { Write-Error "IFW not found"; exit 1 }
          $ifwBin = Join-Path $ifwRoot.FullName "bin"
          & "$ifwBin\binarycreator.exe" -c "$env:INSTALLER_DIR\config\config.xml" -p "$env:INSTALLER_DIR\packages" "$env:INSTALLER_DIR\$env:APP_NAME-$env:SEMVER-windows.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/win32/installer/${{ env.APP_NAME }}-${{ env.SEMVER }}-windows.exe

      # Online repository the installed app's maintenance tool checks against (config.xml's
      # RemoteRepositories, published by the "deploy" job) - this is what makes "check for
      # updates" work for Windows users after install, same idea as the APT repo for Linux.
      - name: Generate update repository (repogen)
        shell: powershell
        run: |
          $ifwRoot = Get-ChildItem "${{ github.workspace }}\ifw-tools\Tools\QtInstallerFramework" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $ifwRoot) { Write-Error "IFW not found"; exit 1 }
          $ifwBin = Join-Path $ifwRoot.FullName "bin"
          & "$ifwBin\repogen.exe" -p "$env:INSTALLER_DIR\packages" "$env:INSTALLER_DIR\repository"

      - name: Upload update repository
        uses: actions/upload-artifact@v4
        with:
          name: repository
          path: dist/win32/installer/repository

  publish:
    name: Publish Release & Attach Packages
    runs-on: ubuntu-latest
    needs: [ release-please, build-linux-deb, build-linux-rpm, build-macos, build-windows ]
    env:
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Download Linux DEB package
        uses: actions/download-artifact@v4
        with:
          name: deb-package-linux
          path: artifacts/linux

      - name: Download Linux RPM package
        uses: actions/download-artifact@v4
        with:
          name: rpm-package-linux
          path: artifacts/linux

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts/macos

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts/windows

      - name: Create GitHub Release (attach packages)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/macos/*.dmg
            artifacts/windows/*.exe
          name: Release ${{ env.SEMVER }}
          tag_name: ${{ env.SEMVER }}
          body: "Automated release for ${{ env.SEMVER }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}

  deploy:
    needs:
      - publish
      - build-apt-repo
    runs-on: ubuntu-latest

    # Required permissions for actions/deploy-pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout apt-repo branch
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-repo-content

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create site folder
        run: |
          mkdir public
          cp ./artifacts/installer-windows/*.exe public/ || true
          cp ./artifacts/installer-macos/*.dmg public/ || true
          cp ./artifacts/deb-package-linux/*.deb public/ || true
          cp ./artifacts/rpm-package-linux/*.rpm public/ || true
          cp -r ./artifacts/repository/* public/ || true
          cp .github/pages/index.html public/index.html || true
          cp version.txt public/version.txt || true
          mkdir -p public/apt
          cp -r apt-repo-content/* public/apt/

      - name: Generate files.json
        run: |
          cd public
          echo '{ "downloads": [' > files.json
          first=true
          for f in *.{exe,deb,rpm,dmg,zip}; do
            [ -f "$f" ] || continue
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> files.json
            fi
            size=$(stat -c%s "$f")
            sha=$(sha256sum "$f" | cut -d" " -f1)
            echo "  {\"file\": \"$f\", \"size\": $size, \"sha256\": \"$sha\"}" >> files.json
          done
          echo "]}" >> files.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4